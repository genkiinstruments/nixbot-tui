[package]
name = "nixbot-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for the nixbot CI server"
license = "MIT"
publish = false

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
etcetera = "0.11.0"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
jiff = { version = "0.2.38", features = ["serde"] }
open = "5.4.5"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
toml = "1.1.8"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6.5"
